<!-- Code adapted from https://docs.mapbox.com/help/tutorials/add-data-to-mapbox-style/ -->

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>EV Charging Stations in Massachusetts</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }

.map-title {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 10px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 5px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.3);
    z-index: 1;
}

.map-overlay {
    position: absolute;
    bottom: 20px;
    left: 10px;
    background: white;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.3);
    z-index: 1;
}

.map-overlay h4 {
    margin: 0 0 5px;
}

.legend-circle {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: #63f75e;
    border-radius: 50%;
    margin-right: 6px;
}

.legend-marker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    vertical-align: middle;
}

.legend-marker svg {
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>
<body>
<div id="map"></div>
<div class="map-title">
  Electric Vehicle Charging Stations in Massachusetts
</div>

<div class="map-overlay" id="legend">
  <h4>Legend</h4>
  <div><span class="legend-circle"></span> Charging Station (Zoomed Out)</div>
    <div>
    <span class="legend-marker">
        <svg viewBox="0 0 23 23">
            <path d="M13.84,6.852,12.6,5.7,11.5,3.5a1.05,1.05,0,0,0-.9-.5H4.4a1.05,1.05,0,0,0-.9.5L2.4,5.7,1.16,6.852A.5.5,0,0,0,1,7.219V11.5a.5.5,0,0,0,.5.5h2c.2,0,.5-.2.5-.4V11h7v.5c0,.2.2.5.4.5h2.1a.5.5,0,0,0,.5-.5V7.219A.5.5,0,0,0,13.84,6.852ZM4.5,4h6l1,2h-8ZM5,8.6c0,.2-.3.4-.5.4H2.4C2.2,9,2,8.7,2,8.5V7.4c.1-.3.3-.5.6-.4l2,.4c.2,0,.4.3.4.5Zm8-.1c0,.2-.2.5-.4.5H10.5c-.2,0-.5-.2-.5-.4V7.9c0-.2.2-.5.4-.5l2-.4c.3-.1.5.1.6.4Z"
                  transform="translate(4 4)"
                  fill="#f7c75e"
                  stroke="#000"
                  stroke-width="1"></path>
        </svg>
    </span> 
    <span>Charging Station (Zoomed In)</span>
</div>
</div>
<script>
    // Access token is URL restricted
    mapboxgl.accessToken = 'pk.eyJ1IjoiaGJyYW5oYW0iLCJhIjoiY21vdGhlMnloMDFybzJ3cHJqbHU3bnh0MSJ9.9eekWtRbN20vJh1xzBBfeQ';
    const map = new mapboxgl.Map({
        container: 'map',
        center: [-71.5, 42.2],
        style: 'mapbox://styles/hbranham/cmnnjynpd009x01p19fkg85tt',
        zoom: 7.5
    });

  const layers = [ 'ev-stations-markers', 'ev-stations-circles']

  layers.forEach((layer, index) => {
    
        // Google Directions Format: https://www.google.com/maps/dir/Current+Location/lat,lng

        // Add Click interaction
        map.addInteraction(`click-marker-${index}`, {
            type: 'click',
            target: { layerId: layer },
            handler: (e) => {
                const popup = new mapboxgl.Popup({ offset: [0, -15] })
            .setLngLat(e.feature.geometry.coordinates)
            .setHTML(
                `<h3>${e.feature.properties.station_name}</h3>
                <p>${e.feature.properties.street_address}</p>
                <a target="_blank" href="https://www.google.com/maps/dir/Current+Location/${e.lngLat.lat},${e.lngLat.lng}">Click Here For Directions</a>`
            )
            .addTo(map);
            }
        });

        // Add mouse-enter interaction
        map.addInteraction(`mouse-enter-marker-${index}`, {
            type: 'mouseenter',
            target: { layerId: layer },
            handler: (e) => {
                console.log(map.style.cursor);
                map.getCanvas().style.cursor = 'pointer';
            }
        });

        // Add mouse-leave interaction
        map.addInteraction(`mouse-leave-marker-${index}`, {
            type: 'mouseleave',
            target: { layerId: layer },
            handler: (e) => {
                map.getCanvas().style.cursor = '';
            }
        });

  })

</script>

</body>
</html>
