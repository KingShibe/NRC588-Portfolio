<html>
    <head>
        <title>Favorite Bondi Beach Cafes</title>

        <link rel="stylesheet" type="text/css" href="./style.css" />
        <!-- prettier-ignore -->
        <script>(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})
        ({key: "AIzaSyA6myHzS10YXdcazAFalmXvDkrYCp5cLc8", v: "weekly", internalUsageAttributionIds: "gmp_git_jsapisamples_v1_core-maps" });</script>
    </head>
    <body>
        
        <gmp-map center="-33.88811419253263,151.27842078123513" zoom="15" map-id="DEMO_MAP_ID">
            
            <div id="controls" slot="control-inline-start-block-start">
                <h3>Favorite Bondi Beach Cafes</h3>
            </div>
            
        </gmp-map>
        
    </body>

    <script>
        async function initMap() {
            // Request needed libraries
            const [{ AdvancedMarkerElement, PinElement }] = await Promise.all([
                google.maps.importLibrary("marker"),
            ]);

            // Get the gmp-map element
            const mapElement = document.querySelector("gmp-map");
            // Get the inner map.
            const innerMap = mapElement.innerMap;

            const infoWindow = new google.maps.InfoWindow();

            // Set map options
            innerMap.setOptions({
                center: { lat: -33.88811419253263, lng: 151.27842078123513 },
                zoom: 16,
                mapTypeControl: false,
            });

            const locations = [
                {
                    title: "Harry's Bondi",
                    position: { lat: -33.88811419253263, lng: 151.27842078123513 },
                    img: "https://lh3.googleusercontent.com/p/AF1QipOHJ36u5xq3NtHG1Aj9bNGkZbXy407tGC9qv3wz=s680-w680-h510-rw"
                },
                {
                    title: "The Depot",
                    position: { lat: -33.888314771315386, lng: 151.27795481608675 },
                    img: "https://thedepotbondi.com/cdn/shop/files/Artboard_3_1520x.jpg?v=1650602172"
                },
                {
                    title: "Cafe Bondi",
                    position: { lat: -33.88954306284465, lng: 151.28289918873566 },
                    img: "https://lh3.googleusercontent.com/p/AF1QipPygvtufvZ-I-9f4I2nF4TNGiqgS_oShdyNZYD-=s680-w680-h510-rw"
                },
                {
                    title: "G’day Bondi Cafe",
                    position: { lat: -33.88637763212946, lng: 151.27973580286914 },
                    img: "https://lh3.googleusercontent.com/p/AF1QipNLnf_zo0Uv0gdnySxGNcUxpb7zx3JJ_1f-j7uI=s680-w680-h510-rw"
                },
                {
                    title: "Parida Bondi",
                    position: { lat: -33.88925053950151, lng: 151.27599884661728 },
                    img: "https://lh3.googleusercontent.com/p/AF1QipM8wl8jiw2ncACCpySVq8KIld-YCH0n5M4kt_2E=s680-w680-h510-rw"
                },
            ];

            for (const loc of locations) {
                const pin = new PinElement({
                    background: "#4285F4",
                    borderColor: "#1a73e8",
                    glyphColor: "white",
                });
                const content = pin.element;

                content.style.transition = "transform 0.2s ease";

                content.addEventListener("mouseenter", () => {
                    content.style.transform = "scale(1.2)";
                    pin.background = "#EA4335";
                    pin.borderColor = "#C5221F";
                });

                content.addEventListener("mouseleave", () => {
                    content.style.transform = "scale(1)";
                    pin.background = "#4285F4";
                    pin.borderColor = "#1a73e8";
                });

                const marker = new AdvancedMarkerElement({
                    map: innerMap,
                    position: loc.position,
                    title: loc.title,
                    content: content,
                });

                marker.addListener("click", () => {
                    infoWindow.setContent(`
                        <div style="text-align:center;">
                            <div style="font-size:16px; font-weight:bold; margin-bottom:6px;">
                            ${loc.title}
                            </div>
                            <img 
                            src="${loc.img}" 
                            style="max-width:200px; height:auto; display:block; margin:0 auto;"
                            />
                        </div>
                    `);

                    infoWindow.open({
                        map: innerMap,
                        anchor: marker
                    })
                })
            }
        }

        initMap();
    </script>
</html>
